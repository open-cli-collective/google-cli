schema: open-cli-identity/v1
repo: google-readwrite
binary: grw
goreleaser_config: .goreleaser.yaml
tag:
  prefix: v
  version_scheme: major_minor_run_patch
archives:
  name_template: "grw_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
packages:
  homebrew:
    canonical_cask: google-readwrite
  linux: { package_name: google-readwrite }

# Darwin Keychain gate: with the backend override unset and a seeded config, the
# arm64 binary must auto-select the macOS Keychain backend. grw shares the
# `config show -j` control-plane command with gro via google-cli-common.
keychain_probe:
  env_unset: [GOOGLE_READWRITE_KEYRING_BACKEND]
  seed_config:
    path: google-readwrite/config.yml
    content: |
      credential_ref: google-readwrite/default
  command: ["config", "show", "-j"]
  output: json
  assertions:
    .backend: keychain
    .backend_source: auto
    .credential_ref: google-readwrite/default

version_file: version.txt
