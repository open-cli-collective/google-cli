schema: open-cli-identity/v1
repo: google-cli
goreleaser_config: .goreleaser.yaml
version_file: version.txt
tag: {prefix: v, version_scheme: major_minor_run_patch}
binaries:
  - name: gro
    archives: {name_template: "gro_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"}
    packages:
      homebrew: {canonical_cask: gro, alias_casks: [google-readonly]}
      winget: {id: OpenCLICollective.google-readonly}
      chocolatey: {id: google-readonly}
      linux: {package_name: google-readonly}
    keychain_probe:
      env_unset: [GOOGLE_READONLY_KEYRING_BACKEND]
      seed_config:
        path: google-readonly/config.yml
        content: |
          credential_ref: google-readonly/default
      command: [config, show, -j]
      output: json
      assertions:
        .backend: keychain
        .backend_source: auto
        .credential_ref: google-readonly/default
  - name: grw
    archives: {name_template: "grw_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"}
    packages:
      homebrew: {canonical_cask: grw, alias_casks: [google-readwrite]}
      winget: {id: OpenCLICollective.grw, bootstrap: true}
      chocolatey: {id: grw}
      linux: {package_name: google-readwrite}
    keychain_probe:
      env_unset: [GOOGLE_READWRITE_KEYRING_BACKEND]
      seed_config:
        path: google-readwrite/config.yml
        content: |
          credential_ref: google-readwrite/default
      command: [config, show, -j]
      output: json
      assertions:
        .backend: keychain
        .backend_source: auto
        .credential_ref: google-readwrite/default
